spring.application.name=careerbridge

# DATABASE (Supabase PostgreSQL)
spring.datasource.url=jdbc:postgresql://aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.hvfplrrpctyxkkfthtbt
spring.datasource.password=YOUR_DB_PASSWORD
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# GOOGLE OAUTH
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=email,profile

# FACEBOOK OAUTH
spring.security.oauth2.client.registration.facebook.client-id=your_facebook_id
spring.security.oauth2.client.registration.facebook.client-secret=your_facebook_secret
spring.security.oauth2.client.registration.facebook.scope=email,public_profile

# SERVER
server.address=0.0.0.0
server.port=8080